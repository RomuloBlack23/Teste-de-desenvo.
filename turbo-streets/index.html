<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>
<title>Turbo Streets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#07040f">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Conceito: tela cheia noturna, neon ciano/rosa sobre roxo profundo. HUD estilo painel de carro. Tema único e escuro por escolha. */
:root{--bg:#07040f;--panel:rgba(14,9,32,.86);--line:rgba(120,200,255,.30);--tx:#f4f1ff;--mut:#9d93c4;--cy:#19f0ff;--pk:#ff2e93;--yl:#ffd23f;--gr:#2eea8a;
--font:'Rajdhani',-apple-system,'Helvetica Neue',Arial,sans-serif;--disp:'Orbitron','Rajdhani',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--font);touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas#gl,canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#fx{pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,rgba(25,240,255,0) 52%,rgba(25,160,255,.5) 100%)}
.hide{display:none!important}
button{font-family:var(--font);color:var(--tx);cursor:pointer}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
#hud>*{position:absolute}
#hPos{left:max(14px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));font-family:var(--disp);font-weight:900;font-size:44px;line-height:1;text-shadow:0 0 14px rgba(255,46,147,.7),0 2px 0 #000}
#hPos span{font-size:20px;color:var(--mut)}
#hLap{left:max(14px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 52px);font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--cy);text-shadow:0 1px 0 #000}
#hTime{left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));text-align:center;font-family:var(--disp);font-weight:700;font-size:20px;text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums}
#hTime small{display:block;font-family:var(--font);font-weight:600;font-size:13px;color:var(--yl);letter-spacing:.05em}
#mini{right:max(14px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:104px;height:104px;border-radius:14px;background:rgba(7,4,15,.55);border:1px solid var(--line)}
#hBtns{right:max(14px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 112px);display:flex;gap:6px;pointer-events:auto}
#hBtns button{width:42px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(7,4,15,.6);font-size:13px;font-weight:700}
#hSpd{left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 4px);text-align:center;font-family:var(--disp);font-weight:900;text-shadow:0 0 16px rgba(25,240,255,.6),0 2px 0 #000}
#hSpd b{font-size:46px;font-variant-numeric:tabular-nums;display:block;line-height:1}
#hSpd small{font-size:11px;color:var(--cy);letter-spacing:.2em}
#hNos{left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 84px);width:170px;height:12px;border-radius:8px;background:rgba(7,4,15,.65);border:1px solid var(--line);overflow:hidden}
#hNos i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#1a8cff,var(--cy));transition:width .1s}
#hNos.on i{background:linear-gradient(90deg,var(--pk),var(--yl))}
#msg{left:0;right:0;top:26%;text-align:center;font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:.06em;text-shadow:0 0 18px currentColor,0 2px 0 #000;opacity:0}
#msg.show{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#wrong{left:0;right:0;top:40%;text-align:center;font-family:var(--disp);font-weight:900;font-size:30px;color:#ff3b3b;text-shadow:0 0 16px #f00;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.25}}
#cd{position:fixed;left:0;right:0;top:28%;text-align:center;font-family:var(--disp);font-weight:900;font-size:110px;pointer-events:none;text-shadow:0 0 30px var(--pk),0 4px 0 #000}
#cd.t{animation:cdp .9s ease-out forwards}
@keyframes cdp{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
/* Controles de toque */
#ctrl{position:fixed;left:0;right:0;bottom:0;height:200px;pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
#pad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(260px,44vw);height:104px;border-radius:52px;background:rgba(14,9,32,.5);border:1.5px solid var(--line);pointer-events:auto;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:30px;color:rgba(255,255,255,.45)}
#knob{position:absolute;top:50%;left:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7df6ff,#139fb5);box-shadow:0 0 18px rgba(25,240,255,.5);transition:transform .06s}
#acts{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 12px);display:grid;grid-template-columns:repeat(2,84px);grid-template-rows:repeat(2,84px);gap:10px;pointer-events:auto}
.act{border-radius:50%;border:2px solid var(--line);background:rgba(14,9,32,.55);font-weight:700;font-size:14px;letter-spacing:.04em;touch-action:none}
.act.p{transform:scale(.93);filter:brightness(1.5)}
#bNos{border-color:var(--pk);color:var(--pk)} #bDrift{border-color:var(--yl);color:var(--yl)} #bBrk{border-color:#ff5a5a;color:#ff7a7a} #bGas{border-color:var(--gr);color:var(--gr)}
#bGas.off{visibility:hidden}
/* Telas */
.screen{position:fixed;inset:0;display:none;align-items:stretch;justify-content:flex-start;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.screen.on{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 16px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#setup .panel{width:min(470px,100%);max-height:100%;padding:10px 14px}
#setup h1{font-family:var(--disp);font-weight:900;font-size:26px;margin:0;letter-spacing:.04em;background:linear-gradient(90deg,var(--cy),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
#setup .sub{margin:2px 0 10px;color:var(--mut);font-size:14px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}
.row>label{width:92px;flex:none;font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:var(--mut);font-weight:700}
.sel{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.sel button.ar{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:16px;flex:none}
.sel .v{flex:1;text-align:center;min-width:0}
.sel .v b{display:block;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel .v small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:50px;padding:6px 6px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:15px;font-weight:700}
.seg button.on{background:linear-gradient(135deg,rgba(25,240,255,.28),rgba(255,46,147,.28));border-color:var(--cy)}
.chips{flex:1;display:flex;gap:8px;flex-wrap:wrap}
.chips i{width:30px;height:30px;border-radius:50%;border:2px solid transparent;display:block}
.chips i.on{border-color:#fff;box-shadow:0 0 12px currentColor}
.stats{display:grid;grid-template-columns:44px 1fr;gap:1px 8px;margin:0 0 0 102px;font-size:11px;color:var(--mut);font-family:var(--disp);letter-spacing:.08em}
.stats em{height:6px;margin-top:4px;border-radius:3px;background:rgba(255,255,255,.1);position:relative;font-style:normal}
.stats em b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,var(--cy),var(--pk))}
#prev{width:76px;height:50px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);flex:none}
#go{width:100%;margin-top:8px;padding:12px;border:0;border-radius:14px;font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:.14em;background:linear-gradient(135deg,var(--pk),#ff7a3d);box-shadow:0 0 24px rgba(255,46,147,.5)}
.tgl{flex:1}
.tglrow{display:flex;gap:6px;flex-wrap:wrap}
#results,#pause{align-items:center;justify-content:center;background:rgba(5,2,14,.6)}
#results .panel,#pause .panel{width:min(480px,100%);max-height:100%;text-align:center}
#results h2,#pause h2{font-family:var(--disp);font-size:22px;margin:0 0 8px;color:var(--yl);letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:16px;text-align:left;font-variant-numeric:tabular-nums}
td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.07)} tr.me td{color:var(--cy);font-weight:700;background:rgba(25,240,255,.08)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns button{flex:1;min-width:120px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;font-size:16px}
.btns button.pri{background:linear-gradient(135deg,var(--pk),#ff7a3d);border:0}
#load{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--disp);letter-spacing:.2em;color:var(--cy);z-index:50}
@media (max-height:430px){#hPos{font-size:34px}#hLap{top:calc(max(10px,env(safe-area-inset-top)) + 40px)}#hSpd b{font-size:36px}#hNos{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 66px)}#pad{height:90px}#acts{grid-template-columns:repeat(2,72px);grid-template-rows:repeat(2,72px)}#setup h1{font-size:20px}.row{margin:6px 0}#cd{font-size:80px;top:22%}}
@media (orientation:portrait){#prev{display:none}#setup .panel{margin-top:auto;max-height:78%}#hNos{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 230px)}#hSpd{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px)}#pad{width:44vw}}
@media (prefers-reduced-motion:reduce){#msg.show,#cd.t{animation-duration:.01s}}
</style>

<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="vig"></div>

<div id="hud" class="hide">
  <div id="hPos"><b id="pos">1</b><span>/8</span></div>
  <div id="hLap">VOLTA <span id="lap">1</span>/<span id="laps">3</span></div>
  <div id="hTime"><span id="time">0:00.00</span><small id="best"></small></div>
  <canvas id="mini" width="208" height="208"></canvas>
  <div id="hBtns"><button id="bPause" aria-label="Pausar">II</button><button id="bCam" aria-label="Câmera">CAM</button><button id="bReset" aria-label="Reposicionar">↺</button></div>
  <div id="hNos"><i id="nosFill"></i></div>
  <div id="hSpd"><b id="spd">0</b><small>KM/H</small></div>
  <div id="msg"></div>
  <div id="wrong" class="hide">CONTRAMÃO!</div>
</div>
<div id="cd"></div>
<div id="ctrl" class="hide">
  <div id="pad"><span>◀</span><span>▶</span><div id="knob"></div></div>
  <div id="acts">
    <button class="act" id="bDrift">DRIFT</button>
    <button class="act" id="bNos">NITRO</button>
    <button class="act" id="bBrk">FREIO</button>
    <button class="act" id="bGas">ACEL</button>
  </div>
</div>

<div id="setup" class="screen on">
  <div class="panel">
    <h1>TURBO STREETS</h1>
    <p class="sub" style="margin-bottom:4px">Corrida de rua 3D · 8 carros · colisão total</p>
    <div class="row"><label>PISTA</label><div class="sel"><button class="ar" data-k="track" data-d="-1" aria-label="Pista anterior">◀</button><div class="v"><b id="tName"></b><small id="tSub"></small></div><button class="ar" data-k="track" data-d="1" aria-label="Próxima pista">▶</button><canvas id="prev" width="152" height="100"></canvas></div></div>
    <div class="row"><label>CARRO</label><div class="sel"><button class="ar" data-k="car" data-d="-1" aria-label="Carro anterior">◀</button><div class="v"><b id="cName"></b><small id="cDesc"></small></div><button class="ar" data-k="car" data-d="1" aria-label="Próximo carro">▶</button></div></div>
    <div class="stats"><span>VEL</span><em><b id="s1"></b></em><span>ACEL</span><em><b id="s2"></b></em><span>CURVA</span><em><b id="s3"></b></em></div>
    <div class="row"><label>COR</label><div class="chips" id="chips"></div></div>
    <div class="row"><label>RIVAIS</label><div class="seg" id="segDiff"></div></div>
    <div class="row"><label>VOLTAS</label><div class="seg" id="segLaps"></div></div>
    <div class="row"><label>OPÇÕES</label><div class="tglrow tgl" id="tgl"></div></div>
    <p class="sub" id="rec" style="margin:6px 0 0"></p>
    <button id="go">CORRER</button>
  </div>
</div>

<div id="pause" class="screen"><div class="panel"><h2>PAUSADO</h2>
  <div class="btns"><button class="pri" id="pResume">Continuar</button><button id="pRestart">Reiniciar</button><button id="pMenu">Menu</button></div></div></div>
<div id="results" class="screen"><div class="panel"><h2 id="rTitle">RESULTADO</h2><table id="rTab"></table><p class="sub" id="rInfo" style="color:var(--mut);margin:8px 0 0"></p>
  <div class="btns"><button class="pri" id="rAgain">Correr de novo</button><button id="rMenu">Menu</button></div></div></div>
<div id="load">CARREGANDO…</div>

function locate(c){const T=track,N=T.N;let best=1e18,bi=c.idx;for(let o=-14;o<=14;o++){const i=(c.idx+o+N)%N,dx=c.x-T.px[i],dz=c.z-T.pz[i],d=dx*dx+dz*dz;if(d<best){best=d;bi=i}}
 const prev=c.idx;c.idx=bi;if(prev>N*.75&&bi<N*.25)c.lap++;else if(prev<N*.25&&bi>N*.75)c.lap--;
 const dx=c.x-T.px[bi],dz=c.z-T.pz[bi];c.lat=dx*T.nx[bi]+dz*T.nz[bi];c.prog=c.lap*N+bi+(dx*T.tx[bi]+dz*T.tz[bi])/T.ds}

function stepCar(c,dt){
 const T=track,W=T.W;if(c.locked)return;
 let sh=Math.sin(c.h),ch=Math.cos(c.h);
 let vF=c.vx*sh+c.vz*ch,vS=c.vx*-ch+c.vz*sh;
 c.steer+=clamp(c.inSteer-c.steer,-7*dt,7*dt);
 const grass=Math.abs(c.lat)>W+1.4;c.grass=grass;
 c.nosOn=c.inNos&&c.nitro>1&&vF>4;
 if(c.nosOn)c.nitro-=30*dt;else c.nitro=Math.min(100,c.nitro+dt*(c.drifting?15:2.2));
 const top=c.st.top*(c.nosOn?1.3:1)*(grass?.55:1)*c.skill;
 if(c.inThrottle>0){if(vF<0)vF+=c.st.acc*1.6*dt;else{const r=clamp(vF/top,0,1.1);vF+=c.st.acc*(c.nosOn?2.1:1)*c.inThrottle*(1-r*r)*dt}}
 if(vF>top)vF-=(vF-top)*1.6*dt;
 if(c.inBrake>0){if(vF>.6)vF=Math.max(0,vF-48*c.inBrake*c.st.brake*dt);else vF=Math.max(-14,vF-16*dt)}
 const sg=Math.sign(vF);vF-=sg*(.5+.00026*vF*vF)*dt;if(grass)vF-=sg*9*dt;if(c.inHand)vF-=sg*4*dt;
 if(Math.abs(vF)<.15&&!c.inThrottle&&!c.inBrake)vF=0;
 const sp=Math.abs(vF),rate=c.steer*2.5*c.st.turn/(1+(sp/38)*(sp/38))*clamp(sp/5,0,1)*(vF<0?-1:1)*(c.inHand?1.55:1);
 const oldSh=sh,oldCh=ch;
 c.h-=rate*dt;c.h+=c.kick*dt;c.kick*=Math.exp(-4.5*dt);
 // velocidade no mundo com ajuste de vF; depois re-decompõe na nova base
 let wx=vF*oldSh+vS*-oldCh,wz=vF*oldCh+vS*oldSh;
 sh=Math.sin(c.h);ch=Math.cos(c.h);
 let nF=wx*sh+wz*ch,nS=wx*-ch+wz*sh;
 let k=10*c.st.grip*(grass?.5:1);if(c.inHand)k=1.7;else k/=1+Math.pow(Math.abs(nS)/11,2);
 const rem=nS*(1-Math.exp(-k*dt));nS-=rem;const tr=lerp(.92,.5,clamp(Math.abs(nS)/12,0,1));nF+=Math.abs(rem)*tr*(nF>=0?1:-1);
 c.fwd=nF;c.slip=nS;c.drifting=Math.abs(nS)>3.5&&Math.abs(nF)>12;
 c.vx=nF*sh+nS*-ch;c.vz=nF*ch+nS*sh;c.x+=c.vx*dt;c.z+=c.vz*dt;
 locate(c);
 const lim=T.LIM-1.15;
 if(Math.abs(c.lat)>lim){const i=c.idx,sd=Math.sign(c.lat),over=Math.abs(c.lat)-lim;c.x-=T.nx[i]*sd*over;c.z-=T.nz[i]*sd*over;
  const vn=(c.vx*T.nx[i]+c.vz*T.nz[i])*sd;
  if(vn>0){c.vx-=1.25*vn*T.nx[i]*sd;c.vz-=1.25*vn*T.nz[i]*sd;c.kick+=sd*clamp(vn,0,20)*.1;
   if(vn>3&&c.hitCd<=0){onHit(c,vn,c.x+T.nx[i]*sd*1.1,c.z+T.nz[i]*sd*1.1,false);c.hitCd=.25}}
  c.vx*=1-1.1*dt;c.vz*=1-1.1*dt;
  if(c.isPlayer&&Math.random()<.35)emit(sparks,c.x+T.nx[i]*sd*1.1,.5,c.z+T.nz[i]*sd*1.1,(Math.random()-.5)*4,2+Math.random()*3,(Math.random()-.5)*4,.4,.5,.1,1,.7,.2,.8,12)}
 if(c.hitCd>0)c.hitCd-=dt;
 // travado?
 const spd=Math.hypot(c.vx,c.vz);if(spd<2&&state==='race'&&(c.inThrottle>0)){c.stuck+=dt;if(c.stuck>(c.isPlayer?3:2)){respawn(c);c.stuck=0}}else c.stuck=Math.max(0,c.stuck-dt)}

function respawn(c){const T=track,N=T.N,ni=c.idx+4;if(ni>=N)c.lap++;const i=ni%N;c.x=T.px[i];c.z=T.pz[i];c.h=Math.atan2(T.tx[i],T.tz[i]);c.vx=T.tx[i]*14;c.vz=T.tz[i]*14;c.idx=i;c.kick=0;c.steer=0;locate(c)}

function onHit(c,power,x,z,carHit){const near=player&&Math.hypot(x-player.x,z-player.z)<40;
 const n=Math.min(14,Math.floor(power*1.2));for(let i=0;i<n;i++)emit(sparks,x,.6,z,(Math.random()-.5)*10,2+Math.random()*5,(Math.random()-.5)*10,.5,.7,.1,1,.75,.25,1,14);
 if(near){Snd.hit(power/16);if(c===player||carHit===player){camShake=Math.min(1,camShake+power/14)}}}

function carCollisions(){
 for(let a=0;a<cars.length;a++){const A=cars[a];for(let b=a+1;b<cars.length;b++){const B=cars[b];
  const dx0=B.x-A.x,dz0=B.z-A.z;if(dx0*dx0+dz0*dz0>40)continue;
  const sa=Math.sin(A.h),ca=Math.cos(A.h),sb=Math.sin(B.h),cb=Math.cos(B.h);
  for(const oa of [-1.15,0,1.15])for(const ob of [-1.15,0,1.15]){
   const ax=A.x+sa*oa,az=A.z+ca*oa,bx=B.x+sb*ob,bz=B.z+cb*ob;let dx=bx-ax,dz=bz-az;const d2=dx*dx+dz*dz,R=2.0;
   if(d2<R*R&&d2>1e-6){const d=Math.sqrt(d2),nx=dx/d,nz=dz/d,pen=R-d,ma=A.st.mass,mb=B.st.mass,tm=ma+mb;
    if(A.locked||B.locked)continue;
    A.x-=nx*pen*mb/tm*.6;A.z-=nz*pen*mb/tm*.6;B.x+=nx*pen*ma/tm*.6;B.z+=nz*pen*ma/tm*.6;
    const rvn=(B.vx-A.vx)*nx+(B.vz-A.vz)*nz;
    if(rvn<0){const j=-(1.38)*rvn/(1/ma+1/mb);A.vx-=j*nx/ma;A.vz-=j*nz/ma;B.vx+=j*nx/mb;B.vz+=j*nz/mb;
     // giro por ponto de contato
     const cxA=nx*1,czA=nz*1,rax=(ax+nx*1)-A.x,raz=(az+nz*1)-A.z,rbx=(bx-nx*1)-B.x,rbz=(bz-nz*1)-B.z;
     A.kick+=clamp(-(rax*(-j*nz)-raz*(-j*nx))/(ma*5),-2.2,2.2)*-1;B.kick+=clamp((rbx*(j*nz)-rbz*(j*nx))/(mb*5),-2.2,2.2)*-1;
     const pw=-rvn;if(pw>2.5&&(A.hitCd<=0||B.hitCd<=0)){onHit(A,pw,(ax+bx)/2,(az+bz)/2,B);A.hitCd=B.hitCd=.2;
      if(A.isPlayer||B.isPlayer){if(pw>6)toast('BATIDA!','#ff5a5a')}}}}}}}}

/* ====================== IA ====================== */
function aiControl(c,dt){
 const T=track,N=T.N,vF=c.fwd,look=clamp(10+Math.abs(vF)*.55,14,50),li=(c.idx+Math.round(look/T.ds))%N;
 c.laneT-=dt;if(c.laneT<=0){c.laneT=1+Math.random()*1.2;let tgt=c.baseLane,blk=null,bd=36;
  for(const o of cars){if(o===c)continue;const d=(o.prog-c.prog)*T.ds;if(d>0&&d<bd&&Math.abs(o.lat-c.lat)<3.6){bd=d;blk=o}}
  if(blk){tgt=c.lat>blk.lat?blk.lat+4.6:blk.lat-4.6;if(Math.abs(tgt)>5.8)tgt=blk.lat>0?blk.lat-4.8:blk.lat+4.8}c.lane=clamp(tgt,-5.8,5.8)}
 c.laneCur+=clamp(c.lane-c.laneCur,-3*dt,3*dt);
 const tx=T.px[li]+T.nx[li]*c.laneCur,tz=T.pz[li]+T.nz[li]*c.laneCur;
 c.inSteer=clamp(-wrapPi(Math.atan2(tx-c.x,tz-c.z)-c.h)*2.4,-1,1);
 let allow=1e9;for(let j=0;j<=52;j+=4){const ii=(c.idx+j)%N,vc=T.vc[ii]*c.skill*c.cornerSkill,a=Math.sqrt(vc*vc+2*26*j*T.ds);if(a<allow)allow=a}
 let tg=Math.min(allow,c.st.top*c.skill*c.rb);
 if(c.autopilot)tg=Math.min(tg,22);
 if(vF<tg-1){c.inThrottle=1;c.inBrake=0}else if(vF>tg+3){c.inThrottle=0;c.inBrake=clamp((vF-tg)/12,.3,1)}else{c.inThrottle=.35;c.inBrake=0}
 c.inNos=!c.autopilot&&allow>c.st.top*c.skill*.96&&(c.nosOn?c.nitro>8:c.nitro>45);c.inHand=false;
 if(!c.isPlayer&&state==='race'){const pl=player,gap=(c.prog-pl.prog)*T.ds;c.rb=clamp(1-gap/1400,.9,1.07)}}

function readInput(c){const gas=input.gas||(S.auto&&!input.brake);c.inThrottle=gas?1:0;c.inBrake=input.brake?1:0;c.inSteer=clamp(input.steer+(input.kr?1:0)-(input.kl?1:0),-1,1);c.inHand=input.drift;c.inNos=input.nos}

const STEP=1/60;
function simulate(dt){
 if(state==='menu')return;
 if(state==='countdown'){introT+=dt;cdTimer-=dt;const n=Math.ceil(cdTimer-.2);
  if(n!==cdLast&&n<=3){cdLast=n;const el=$('cd');if(n>0){el.textContent=n;Snd.cd(false)}else{el.textContent='VAI!';Snd.cd(true)}el.classList.remove('t');void el.offsetWidth;el.classList.add('t')}
  if(cdTimer<=.2){state='race';raceTime=0;cars.forEach(c=>{c.locked=false;c.lapStart=0});toast('LARGADA!','#2eea8a')}}
 else raceTime+=dt;
 const live=state==='race'||state==='finished';
 for(const c of cars){
  if(c.isPlayer&&!c.autopilot)readInput(c);else if(live)aiControl(c,dt);
  if(c.isPlayer&&state==='countdown'){readInput(c)}
  const lapBefore=c.lap;stepCar(c,dt);
  if(c.lap>lapBefore&&live)onLap(c)}
 carCollisions();
 // ranking
 const arr=cars.slice().sort((a,b)=>(b.finished?1e9-b.finishTime:b.prog)-(a.finished?1e9-a.finishTime:a.prog));arr.forEach((c,i)=>c.rank=i+1);
 if(state==='race'||state==='finished'){
  if(player.rank<lastRank&&state==='race'&&raceTime>3){toast('ULTRAPASSAGEM!  '+player.rank+'º','#19f0ff')}lastRank=player.rank;
  // contramão
  const T=track,i=player.idx,dotv=Math.sin(player.h)*T.tx[i]+Math.cos(player.h)*T.tz[i];
  if(dotv<-.3&&Math.hypot(player.vx,player.vz)>6)wrongT+=dt;else wrongT=0;$('wrong').classList.toggle('hide',wrongT<1);
  if(state==='finished'){finishT+=dt;if(finishT>2.4&&!$('results').classList.contains('on'))showResults()}}
}
function onLap(c){const T=track;
 if(c.lap>=2&&c.lap<=S.laps+1||c.lap===S.laps+1){}
 if(c.lap>=2){const lt=raceTime-c.lapStart;c.lapTimes.push(lt);if(lt<c.bestLap)c.bestLap=lt;
  if(c.isPlayer){const rec=store.get('best'+S.track,0);if(!rec||lt<rec){store.set('best'+S.track,lt);if(rec&&c.lap<=S.laps)toast('NOVO RECORDE! '+fmt(lt),'#ffd23f');$('best').textContent='RECORDE '+fmt(lt)}else if(c.lap<=S.laps)toast('VOLTA '+fmt(lt),'#f4f1ff')}}
 c.lapStart=raceTime;
 if(c.lap>S.laps&&!c.finished){c.finished=true;c.finishTime=raceTime;
  if(c.isPlayer){c.autopilot=true;state='finished';finishT=0;Snd.fanfare();toast(c.rank===1?'VITÓRIA!':'CHEGADA!  '+c.rank+'º','#ffd23f');c.inNos=false}}
 else if(c.isPlayer&&c.lap===S.laps&&S.laps>0)toast('ÚLTIMA VOLTA!','#ff2e93')}
function showResults(){
 const arr=cars.slice().sort((a,b)=>(b.finished?1e9-b.finishTime:b.prog)-(a.finished?1e9-a.finishTime:a.prog));
 const t=$('rTab');t.innerHTML='';arr.forEach((c,i)=>{const tr=document.createElement('tr');if(c.isPlayer)tr.className='me';
  const td=(x)=>{const d=document.createElement('td');d.textContent=x;tr.appendChild(d)};td((i+1)+'º');td(c.name+' · '+CARS[c.type].name);td(c.finished?fmt(c.finishTime):'em prova');t.appendChild(tr)});
 const pr=arr.indexOf(player)+1;$('rTitle').textContent=pr===1?'VITÓRIA!':pr<=3?'PÓDIO · '+pr+'º LUGAR':'VOCÊ TERMINOU EM '+pr+'º';
 const bp=store.get('bestpos'+S.track,9);if(pr<bp){store.set('bestpos'+S.track,pr)}
 $('rInfo').textContent='Melhor volta: '+fmt(player.bestLap<1e8?player.bestLap:NaN)+(store.get('best'+S.track,0)?'  ·  Recorde da pista: '+fmt(store.get('best'+S.track,0)):'');
 $('results').classList.add('on')}
function toast(t,col){const m=$('msg');m.textContent=t;m.style.color=col||'#fff';m.classList.remove('show');void m.offsetWidth;m.classList.add('show')}

function posMesh(c,dt){const m=c.mesh;m.position.set(c.x,0,c.z);m.rotation.y=c.h;
 const body=m.userData.body;const ls=c.fwd-c.lastF;c.lastF=c.fwd;
 const tr=clamp(-c.steer*clamp(c.fwd/40,0,1)*.06,-.07,.07),tp=clamp(-(ls/Math.max(dt,.001))*.0014,-.05,.05);
 c.roll+=(tr-c.roll)*Math.min(1,dt*8);c.pitch+=(tp-c.pitch)*Math.min(1,dt*8);body.rotation.z=c.roll;body.rotation.x=c.pitch;
 m.userData.brakeMat.color.setHex(c.inBrake>0?0xff2020:0x881818)}
const tmpV=new THREE.Vector3();
function updCamera(dt){
 const c=player,spd=Math.hypot(c.vx,c.vz);
 if(state==='menu'){orbit+=dt*.35;const r=innerWidth<innerHeight?13:8.2;camPos.set(c.x+Math.sin(orbit)*r,2.6,c.z+Math.cos(orbit)*r);camLook.set(c.x,.9,c.z);camera.position.copy(camPos);camera.lookAt(camLook);fovCur=lerp(fovCur,50,.1);camera.fov=fovCur;setOffset(innerWidth>innerHeight?-innerWidth*.26:0,innerWidth<=innerHeight?innerHeight*.24:0);camera.updateProjectionMatrix();return}
 let tH=c.h;if(spd>8)tH=c.h+wrapPi(Math.atan2(c.vx,c.vz)-c.h)*.35;camH+=wrapPi(tH-camH)*(1-Math.exp(-dt*6));
 let a=camH;if(state==='countdown'){const e=clamp(introT/3.2,0,1);a+=(1-e*e*(3-2*e))*-2.4}
 setOffset(0,0);const mode=S.cam;let dist,hei,la;
 if(mode===0){dist=7.4+spd*.035;hei=2.9+spd*.01;la=6+spd*.07}else if(mode===1){dist=11+spd*.04;hei=6;la=8}else{dist=-.5;hei=1.18;la=14}
 const sx=Math.sin(a),sz=Math.cos(a);
 const tx=c.x-sx*dist,tz=c.z-sz*dist,ty=hei;
 const k=state==='countdown'?1:1-Math.exp(-dt*(mode===2?30:11));
 camPos.x=lerp(camPos.x,tx,k);camPos.y=lerp(camPos.y,ty,k);camPos.z=lerp(camPos.z,tz,k);
 if(camPos.distanceTo(tmpV.set(tx,ty,tz))>30)camPos.set(tx,ty,tz);
 camera.position.copy(camPos);
 if(camShake>0){camera.position.x+=(Math.random()-.5)*camShake*.8;camera.position.y+=(Math.random()-.5)*camShake*.6;camShake=Math.max(0,camShake-dt*2.2)}
 camLook.set(c.x+sx*la,(mode===2?1.1:1.1),c.z+sz*la);camera.lookAt(camLook);
 const bf=window.innerWidth<window.innerHeight?74:60;const tf=bf+spd*.2+(c.nosOn?12:0);fovCur=lerp(fovCur,tf,1-Math.exp(-dt*4));camera.fov=fovCur;camera.updateProjectionMatrix()}

let offOn=false;function setOffset(x,y){if(x||y){camera.setViewOffset(innerWidth,innerHeight,x,y,innerWidth,innerHeight);offOn=true}else if(offOn){camera.clearViewOffset();offOn=false}}

function updHud(dt){const c=player;const s=Math.round(Math.hypot(c.vx,c.vz)*3.6);if(s!==lastSpd){$('spd').textContent=s;lastSpd=s}

const mini=$('mini'),mg=mini.getContext('2d');let miniBG=null,miniKey=-1;
function mapXY(x,z,T,sz){const bb=T.bb,w=bb[1]-bb[0],h=bb[3]-bb[2],s=(sz-24)/Math.max(w,h);return[(x-bb[0])*s+12+(sz-24-w*s)/2,(z-bb[2])*s+12+(sz-24-h*s)/2]}
function trackShape(cvs,T,col,lw){const g=cvs.getContext('2d'),sz=Math.min(cvs.width,cvs.height);g.clearRect(0,0,cvs.width,cvs.height);g.lineJoin='round';g.lineWidth=lw;g.strokeStyle=col;g.beginPath();for(let i=0;i<=T.N;i+=4){const p=mapXY(T.px[i%T.N],T.pz[i%T.N],T,sz);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.closePath();g.stroke()}
function drawMini(){const T=track;if(miniKey!==S.track){miniBG=cv(208,208);const g=miniBG.getContext('2d');trackShape(miniBG,T,'rgba(255,255,255,.28)',11);const g2=miniBG.getContext('2d');g2.save();trackShape2(miniBG,T);g2.restore();miniKey=S.track}

 for(const c of cars){const p=mapXY(c.x,c.z,T,208);mg.beginPath();mg.fillStyle=c.isPlayer?'#fff':'#'+new THREE.Color(c.color).getHexString();mg.arc(p[0],p[1],c.isPlayer?7:5,0,TAU);mg.fill();if(c.isPlayer){mg.strokeStyle='#19f0ff';mg.lineWidth=3;mg.stroke()}}}
function trackShape2(cvs,T){const g=cvs.getContext('2d'),sz=208;g.lineWidth=3;g.strokeStyle='rgba(10,5,25,.9)';g.beginPath();for(let i=0;i<=T.N;i+=4){const p=mapXY(T.px[i%T.N],T.pz[i%T.N],T,sz);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.closePath();g.stroke();
 const p=mapXY(T.px[0],T.pz[0],T,sz);g.fillStyle='#ffd23f';g.fillRect(p[0]-5,p[1]-5,10,10)}
function drawFx(dt){const w=fxc.width,h=fxc.height;fx.clearRect(0,0,w,h);const c=player,spd=Math.hypot(c.vx,c.vz);const k=clamp((spd-42)/40,0,1)+(c.nosOn?.6:0);if(k<=.02||state==='menu')return;
 fx.strokeStyle='rgba(200,240,255,'+(.25*Math.min(1,k))+')';fx.lineWidth=1.5;fx.beginPath();const cx=w/2,cy=h*.46,n=Math.floor(14*Math.min(1.3,k)+4);

function effects(dt){
 const camP=camera.position;
 for(const c of cars){const d2=(c.x-camP.x)**2+(c.z-camP.z)**2;if(d2>6400||state==='menu')continue;
  const sh=Math.sin(c.h),ch=Math.cos(c.h),rx=-ch,rz=sh;

  if(c.grass&&Math.hypot(c.vx,c.vz)>10){emit(smoke,c.x-sh*1.3,.3,c.z-ch*1.3,(Math.random()-.5)*2,1.2,(Math.random()-.5)*2,1.1,1,3.8,.7,.55,.35,.5,-.2)}
  if(c.nosOn){for(const sd of [-1,1]){const wob=Math.random();emit(sparks,c.x-sh*2.35+rx*sd*.55,.5,c.z-ch*2.35+rz*sd*.55,-sh*8*Math.random()+c.vx*.5,.2,-ch*8*Math.random()+c.vz*.5,.28,1.0,.3,wob>.5?.3:1,wob>.5?.65:.55,1,.9,0)}}}
 updPS(smoke,dt);updPS(sparks,dt);
 const sc=renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360));smoke.m.uniforms.scale.value=sparks.m.uniforms.scale.value=sc}

let fpsAcc=0,fpsN=0,lowT=0,highT=0;
function adaptive(dt){if(S.gfx!==0)return;fpsAcc+=dt;fpsN++;if(fpsAcc>=2){const avg=fpsAcc/fpsN;fpsAcc=0;fpsN=0;
 if(avg>1/44&&pr>.8){setPR(Math.max(.75,pr-.2))}else if(avg<1/57&&pr<prMax-.05){highT++;if(highT>=3){setPR(Math.min(prMax,pr+.15));highT=0}}else highT=0}}

let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;dt=Math.min(dt,.1);
 if(!paused){acc+=dt;let n=0;while(acc>=STEP&&n<5){simulate(STEP);acc-=STEP;n++}if(n>=5)acc=0;
  for(const c of cars)posMesh(c,dt);
  updCamera(dt);effects(dt);
  const near=cars.filter(c=>c!==player).map(c=>({c,d:(c.x-player.x)**2+(c.z-player.z)**2})).sort((a,b)=>a.d-b.d).slice(0,2).map(o=>o.c);
  Snd.upd(player,state==='menu'?[]:near,dt);
  skyGroup.position.copy(camera.position);
  if(state!=='menu'){hudT+=dt;updHud(dt)}
  adaptive(dt)}
 renderer.render(scene,camera)}

/* ====================== UI ====================== */
function refreshSetup(){const t=TRACKS[S.track],c=CARS[S.car];$('tName').textContent=t.name;$('tSub').textContent=t.sub;$('cName').textContent=c.name;$('cDesc').textContent=c.desc;
 $('s1').style.width=((c.top-55)/20*100)+'%';$('s2').style.width=((c.acc-24)/16*100)+'%';$('s3').style.width=((c.turn-.7)/.6*100)+'%';
 [...$('chips').children].forEach((e,i)=>e.classList.toggle('on',i===S.color));
 const sg=(id,items,cur,fn)=>{const el=$(id);el.innerHTML='';items.forEach((it,i)=>{const b=document.createElement('button');b.textContent=it;b.className=i===cur?'on':'';b.onclick=()=>{fn(i)};el.appendChild(b)})};
 sg('segDiff',DIFFS.map(d=>d.n),S.diff,i=>{S.diff=i;saveS();refreshSetup()});
 sg('segLaps',['2','3','5'],[2,3,5].indexOf(S.laps),i=>{S.laps=[2,3,5][i];saveS();refreshSetup()});
 const tg=$('tgl');tg.innerHTML='';[['Acelerar sozinho',S.auto,()=>{S.auto=!S.auto}],['Música',S.music,()=>{S.music=!S.music}],['Efeitos',S.sfx,()=>{S.sfx=!S.sfx}],['Gráficos: '+['Auto','Alto','Leve'][S.gfx],true,()=>{S.gfx=(S.gfx+1)%3;applyGfx()}]].forEach(o=>{const b=document.createElement('button');b.textContent=o[0];b.style.cssText='padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:700;background:'+(o[1]?'rgba(25,240,255,.18)':'rgba(255,255,255,.04)');b.onclick=()=>{o[2]();saveS();Snd.setVol();refreshSetup()};tg.appendChild(b)});
 const bl=store.get('best'+S.track,0),bp=store.get('bestpos'+S.track,0);$('rec').textContent=(bl?'Recorde: '+fmt(bl):'Sem recorde ainda')+(bp&&bp<9?'  ·  Melhor posição: '+bp+'º':'');
 trackShape($('prev'),getTrack(S.track),'#19f0ff',3)}
function applyGfx(){prMax=S.gfx===1?Math.min(devicePixelRatio||1,2):S.gfx===2?1:Math.min(devicePixelRatio||1,1.5);setPR(S.gfx===0?Math.min(prMax,1.5):prMax)}
document.querySelectorAll('.ar').forEach(b=>b.onclick=()=>{const k=b.dataset.k,d=+b.dataset.d;if(k==='track'){S.track=(S.track+d+TRACKS.length)%TRACKS.length;saveS();startScene()}else{S.car=(S.car+d+CARS.length)%CARS.length;saveS();startScene()}refreshSetup()});
COLORS.forEach((c,i)=>{const e=document.createElement('i');e.style.background='#'+new THREE.Color(c).getHexString();e.style.color=e.style.background;e.onclick=()=>{S.color=i;saveS();startScene();refreshSetup()};$('chips').appendChild(e)});
$('go').onclick=()=>{Snd.init();Snd.setVol();startRace()};
addEventListener('pointerdown',()=>{Snd.init();Snd.setVol()},{capture:true});
function pause(v){if(state==='menu'||state==='countdown'&&false)return;paused=v;$('pause').classList.toggle('on',v);if(Snd.ctx){v?Snd.ctx.suspend():Snd.ctx.resume()}}
$('bPause').onclick=()=>pause(true);$('pResume').onclick=()=>pause(false);$('pRestart').onclick=()=>{pause(false);startRace()};$('pMenu').onclick=()=>{if(Snd.ctx)Snd.ctx.resume();toMenu()};
$('rAgain').onclick=()=>startRace();$('rMenu').onclick=()=>toMenu();
$('bCam').onclick=()=>{S.cam=(S.cam+1)%3};
$('bReset').onclick=()=>{if(state==='race'&&resetCd<=0){respawn(player);resetCd=1}};
setInterval(()=>{if(resetCd>0)resetCd-=.2},200);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='race'||state==='countdown'))pause(true)});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.panel'))e.preventDefault()},{passive:false});
function bind(el,on,off){const d=e=>{e.preventDefault();el.classList.add('p');try{el.setPointerCapture(e.pointerId)}catch(_){}on()},u=e=>{e.preventDefault();el.classList.remove('p');off()};el.addEventListener('pointerdown',d);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)}
bind($('bNos'),()=>input.nos=true,()=>input.nos=false);bind($('bDrift'),()=>input.drift=true,()=>input.drift=false);bind($('bBrk'),()=>input.brake=true,()=>input.brake=false);bind($('bGas'),()=>input.gas=true,()=>input.gas=false);
const pad=$('pad'),knob=$('knob');let padId=null;
function padSet(e){const r=pad.getBoundingClientRect(),v=clamp((e.clientX-(r.left+r.width/2))/(r.width*.34),-1,1);input.steer=Math.abs(v)<.08?0:v;knob.style.transform='translateX('+input.steer*r.width*.34+'px)'}
pad.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch(_){}padSet(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padSet(e)});
const padEnd=e=>{if(e.pointerId===padId){padId=null;input.steer=0;knob.style.transform=''}};pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')input.kl=true;else if(k==='ArrowRight'||k==='d')input.kr=true;else if(k==='ArrowUp'||k==='w')input.gas=true;else if(k==='ArrowDown'||k==='s')input.brake=true;else if(k===' ')input.drift=true;else if(k==='Shift'||k==='n')input.nos=true;else if(k==='p'||k==='Escape')pause(!paused);else if(k==='c')S.cam=(S.cam+1)%3;else if(k==='r')$('bReset').onclick();if(k.startsWith('Arrow')||k===' ')e.preventDefault()});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')input.kl=false;else if(k==='ArrowRight'||k==='d')input.kr=false;else if(k==='ArrowUp'||k==='w')input.gas=false;else if(k==='ArrowDown'||k==='s')input.brake=false;else if(k===' ')input.drift=false;else if(k==='Shift'||k==='n')input.nos=false});

/* ====================== INÍCIO ====================== */
renderer.setPixelRatio(pr);resize();applyGfx();
startScene();refreshSetup();
window.__ts={S,cars:()=>cars,player:()=>player,state:()=>state,track:()=>track,startRace,simulate,TRACKS,getTrack,input,setAuto(v){player.autopilot=v}};
requestAnimationFrame(t=>{last=t;$('load').classList.add('hide');requestAnimationFrame(frame)});
})();
